name: CI/CD — Build, Push & Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Run tests and TypeScript compilation check
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation check
        run: npm run build

      - name: Run tests
        run: npm test -- --passWithNoTests --forceExit

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Build Docker image and push to Azure Container Registry
  # ──────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/myride-api:${{ github.sha }}
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/myride-api:latest

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy to Azure App Service (Web App for Containers)
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container image to Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          images: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/myride-api:${{ github.sha }}

      - name: Update App Service application settings
        run: |
          az webapp config appsettings set \
            --name ${{ vars.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --settings \
              NODE_ENV=production \
              PORT=3000 \
              WEBSITES_PORT=3000 \
              FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
              JWT_ACCESS_EXPIRATION=15m \
              JWT_REFRESH_EXPIRATION=30d \
              ENABLE_FIREBASE=true \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              REDIS_URL="${{ secrets.REDIS_URL }}" \
              JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              FIREBASE_SERVICE_ACCOUNT_PATH="/app/secrets/firebase.json" \
              LIVEKIT_API_KEY="${{ secrets.LIVEKIT_API_KEY }}" \
              LIVEKIT_API_SECRET="${{ secrets.LIVEKIT_API_SECRET }}" \
              LIVEKIT_WS_URL="${{ secrets.LIVEKIT_WS_URL }}"
