services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myride-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://myride:myride_dev_password@postgres:5432/myride
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: myride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myride}
      POSTGRES_USER: ${POSTGRES_USER:-myride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myride_dev_password}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-myride} -d ${POSTGRES_DB:-myride}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myride-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: myride-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - '7880:7880'   # WebSocket
      - '7881:7881'   # HTTP API
      - '7882:7882/udp'  # WebRTC media
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:7881/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
