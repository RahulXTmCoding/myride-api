# LiveKit production config for Azure VM deployment
#
# VM public IP: 20.193.246.194 (static, resource: pip-livekit in Attars RG)
#
# Differences from local dev (livekit.yaml):
#   - use_external_ip: false  — IP pinned explicitly to avoid STUN validation
#                               timeout on Azure VMs (STUN times out ~5s)
#   - node_ip: 20.193.246.194 — advertised in ICE candidates so Android clients
#                               can reach the media ports from outside the VM
#   - keys loaded from        — environment variable LIVEKIT_KEYS at runtime
#                               (set in /etc/livekit.env on the VM, never committed)
#   - turn disabled           — no domain name for TLS cert; TCP fallback on 7881
#                               handles clients behind UDP-blocking firewalls
#
# Deploy: docker compose -f docker-compose.livekit.yml up -d

port: 7880
bind_addresses:
  - ""

rtc:
  # UDP port range for WebRTC media — must be open in Azure NSG
  port_range_start: 50000
  port_range_end: 50100

  # TCP fallback for WebRTC (clients behind firewalls that block UDP)
  tcp_port: 7881

  # Pin the public IP explicitly — avoids STUN validation timeout on Azure
  # Update this if the VM's static IP ever changes
  use_external_ip: false
  node_ip: 20.193.246.194

# TURN disabled — no domain name available for TLS cert.
# TCP fallback on port 7881 handles clients behind UDP-blocking firewalls.
# Re-enable with a real domain + cert if deeper firewall penetration is needed.
turn:
  enabled: false

# API keys — loaded from LIVEKIT_KEYS environment variable at runtime
# Format of env var:  LIVEKIT_KEYS="apikey1: apisecret1"
# The docker-compose.livekit.yml reads this from /etc/livekit.env
keys: {}

logging:
  level: info
  pion_level: error   # suppress noisy WebRTC internals

room:
  empty_timeout: 300          # auto-delete empty rooms after 5 min
  max_participants: 20        # myRide max group size
  departure_timeout: 20       # seconds before a disconnected participant is removed
